[project]
name = "data-science-learning"
version = "0.1.0"
description = "Data science and ML learning exercises — visualisation, EDA and regression"
readme = "README.md"
authors = [{ name = "Alicja" }]
requires-python = ">=3.12"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.0.0",
    "pandas>=3.0.0",
    "plotly>=5.0.0",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.0",
    "statsmodels>=0.14.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
