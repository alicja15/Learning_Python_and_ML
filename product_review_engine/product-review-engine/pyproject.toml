[project]
name = "product-review-engine"
version = "0.1.0"
description = "LLM-powered extraction of sentiment, category and recommendations from Amazon product reviews"
readme = "README.md"
authors = [
    { name = "Alicja" }
]
requires-python = ">=3.12"
dependencies = [
    "jupyter>=1.1.1",
    "kagglehub>=0.3.0",
    "matplotlib>=3.11.1",
    "openai>=2.52.0",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.2",
    "seaborn>=0.13.2",
]

[project.scripts]
product-review-engine = "product_review_engine:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
